<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Background gradient -->
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2C6C6"/>
      <stop offset="100%" stop-color="#C9D4F6"/>
    </linearGradient>

    <!-- Glass overlay -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Rose gold gradient text -->
    <linearGradient id="rosegold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6D1C9"/>
      <stop offset="50%" stop-color="#E6AFA7"/>
      <stop offset="100%" stop-color="#C98C84"/>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect x="2" y="2" width="60" height="60" rx="18"
        fill="url(#grad)"/>

  <!-- Glass layer -->
  <rect x="2" y="2" width="60" height="60" rx="18"
        fill="url(#glass)"
        stroke="rgba(255,255,255,0.35)"
        stroke-width="1.5"/>

  <!-- Light reflection -->
  <path d="M8 18 Q32 -2 56 18"
        stroke="white"
        stroke-opacity="0.35"
        fill="none"/>

  <!-- Centered initials -->
  <text
        x="32"
        y="34"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="Inter, sans-serif"
        font-size="26"
        font-weight="600"
        letter-spacing="0.5"
        fill="url(#rosegold)">
        MT
  </text>

</svg>
